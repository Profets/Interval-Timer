<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Interval</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Interval">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0C0F">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preload" href="fonts/Urbanist-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/JetBrainsMono-Medium.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Urbanist";src:url(fonts/Urbanist-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Urbanist";src:url(fonts/Urbanist-ExtraBold.woff2) format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url(fonts/JetBrainsMono-Medium.woff2) format("woff2");font-weight:400 600;font-display:swap}
[hidden]{display:none!important}
html,body{margin:0;overscroll-behavior:none}
html{background:#0b0c0f}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* Layout: retro-futurist field instrument. Home = big-number setup rows (tap → full-screen wheel editor).
   Start boots a 60-tick dial; Reset/Done powers it down back to the setup. Single deliberate dark look. */
:root{
  color-scheme:dark;
  /* synced from Figma (Retro collection) */
  --bg:#0b0c0f; --panel:#16181d; --panel2:#101116; --raise:#1c1e26; --fg:#efe6d2; --muted:#8c8984; --dim:#363533; --line:rgba(239,230,210,.09);
  --yellow:#f2b43c; --red:#ea5a3c; --green:#7cb86a; --blue:#5f93d6;
  --phase:var(--yellow);
  --f-display:"Urbanist","Avenir Next","Century Gothic",system-ui,sans-serif;
  --f-body:var(--f-display);
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
html,body{height:100%}
body{background:#0b0c0f;touch-action:manipulation;display:flex;align-items:center;justify-content:center;color:var(--fg);font-family:var(--f-body);font-size:15px;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);-webkit-tap-highlight-color:transparent;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,.wheel:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
.gutter{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

.device{position:relative;width:100%;height:100%;overflow:hidden;container-type:inline-size;
  background:var(--bg)}
/* iOS safe areas. On a real phone the page itself is already inset by the system, so the frame adds nothing.
   In the desktop frame (and in .sim) we simulate an iPhone X: 44 pt status bar / notch area on top, 34 pt home-indicator area at the bottom. */
.device{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)} /* installed web app: real iPhone safe areas */
.ios-status,.ios-home{display:none}
@media (min-width:520px) and (min-height:700px){body{background:#050608}.device{max-width:375px;max-height:812px;height:calc(100% - 48px);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.5)}}
@media (min-width:520px) and (min-height:700px){.device{--sat:44px;--sab:34px}.ios-status,.ios-home{display:flex}}
.device.sim{--sat:44px;--sab:34px}.device.sim .ios-status,.device.sim .ios-home{display:flex}
.ios-status{position:absolute;left:0;right:0;top:0;height:44px;z-index:55;align-items:center;justify-content:space-between;padding:0 26px 0 32px;pointer-events:none;
  font:600 15px/1 -apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--fg)}
.ios-status .notch{position:absolute;left:50%;top:0;width:150px;height:30px;margin-left:-75px;background:#000;border-radius:0 0 18px 18px}
.ios-status svg{height:12px;width:auto}
.ios-home{position:absolute;left:0;right:0;bottom:0;height:34px;z-index:55;align-items:center;justify-content:center;pointer-events:none}
.ios-home i{width:134px;height:5px;border-radius:3px;background:var(--fg);opacity:.9;margin-top:8px}
.app{height:100%;display:flex;flex-direction:column;padding-top:calc(14px + var(--sat));padding-bottom:max(16px,calc(var(--sab) - 6px));gap:14px}  /* ~28 pt above the screen edge on Face ID iPhones, like Figma */

/* Header with the four-band mark */
header{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.mark{display:flex;align-items:center;gap:12px}
/* Logo mark (from Figma): four 30×4 bands, 3 apart, alternating 0 / +4 offset */
.bands{display:grid;grid-template-rows:repeat(4,4px);gap:3px;width:34px}
.bands i{display:block;width:30px;height:4px;border-radius:2px;--g:var(--yellow);box-shadow:0 0 4px color-mix(in srgb,var(--g) 20%,transparent)}
.bands i:nth-child(2){--g:var(--red)}.bands i:nth-child(3){--g:var(--green)}.bands i:nth-child(4){--g:var(--blue)}
.bands i:nth-child(2),.bands i:nth-child(4){margin-left:4px}
.bands i:nth-child(1){background:var(--yellow)}.bands i:nth-child(2){background:var(--red)}.bands i:nth-child(3){background:var(--green)}.bands i:nth-child(4){background:var(--blue)}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.02em;line-height:1}
.brand small{display:block;font-family:var(--f-mono);font-weight:500;font-size:9.5px;letter-spacing:.18em;color:var(--muted);margin-top:4px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
.icon-btn svg{width:24px;height:24px}
.mono{font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* Fixed-width digits so numbers never jitter, with a plain zero */
.digits{display:inline-flex;font-family:var(--f-display);font-weight:700;font-feature-settings:"tnum";letter-spacing:0}
.digits .d{display:inline-block;width:.6em;text-align:center}
.digits .c{display:inline-block;width:.28em;text-align:center}

.views{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;display:flex;flex-direction:column}

/* Home: big-number setup */
.sec{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sec .mono{color:var(--dim)}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.rows{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0}
/* Card: dark panel, soft neutral stroke, full-height phase line on the left edge */
.acard{position:relative;overflow:hidden;border-radius:10px;border:1px solid var(--line);
  background:linear-gradient(160deg,color-mix(in srgb,var(--panel) 40%,transparent) 0%,color-mix(in srgb,var(--panel2) 40%,transparent) 100%)}
.acard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c);pointer-events:none;
  box-shadow:16px 0 80px var(--c)} /* soft wash of the phase colour into the card, clipped by the card */
.acard > *{position:relative}
.row{flex:1;min-height:52px;display:flex;align-items:center;gap:14px;text-align:left;padding:0 16px 0 18px;transition:border-color .2s,transform .15s,filter .2s}
.row:hover{filter:brightness(1.08)}
.row:active{transform:scale(.985)}
.row .tag{display:none}
.row .id{position:absolute;right:12px;top:7px;font-family:var(--f-mono);font-size:8.5px;letter-spacing:.16em;color:var(--muted);opacity:.7}
.row .lab,.next .lab{display:flex;flex-direction:column;gap:3px;min-width:0}
.row .name,.next .name{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.row .val{margin-left:auto;font-size:clamp(34px,12cqw,46px);line-height:1}
.row.count .val{color:var(--fg)}
.row.dim{opacity:.35}
.row .edit{width:7px;height:12px;color:var(--muted);flex:none;margin-left:4px}
.foot{display:flex;justify-content:space-between;align-items:center;padding:12px 4px 0}
.foot .total{font-size:20px;color:var(--fg)}

/* Run: HUD + dial */
.hud{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hud > div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:14px 12px 12px;text-align:center;border-radius:10px;border:1px solid var(--line);
  background:linear-gradient(160deg,color-mix(in srgb,var(--panel) 40%,transparent) 0%,color-mix(in srgb,var(--panel2) 40%,transparent) 100%)}
.hud .digits{font-size:58px;line-height:1}
.dialwrap{flex:1;min-height:0;position:relative;display:grid;place-items:center}
.dialwrap .cn{position:absolute;width:18px;height:18px;border-color:var(--dim);border-style:solid;border-width:0}
.cn.tl{left:0;top:0;border-left-width:1px;border-top-width:1px;border-top-left-radius:6px}
.cn.tr{right:0;top:0;border-right-width:1px;border-top-width:1px;border-top-right-radius:6px}
.cn.bl{left:0;bottom:0;border-left-width:1px;border-bottom-width:1px;border-bottom-left-radius:6px}
.cn.br{right:0;bottom:0;border-right-width:1px;border-bottom-width:1px;border-bottom-right-radius:6px}
.readout{position:absolute;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;color:var(--dim)}
/* readouts sit inside their corner bracket: clear of both arms, aligned to the bracket's inner edge */
.readout{line-height:12px;white-space:nowrap}
.readout.tl{left:10px;top:8px}.readout.tr{right:10px;top:8px;text-align:right}.readout.bl{left:10px;bottom:8px}.readout.br{right:10px;bottom:8px;text-align:right}
.readout b{color:var(--muted);font-weight:500}
.dial{position:absolute;inset:0;width:100%;height:100%}
/* Uniform square-cut segments; the gaps are a background-coloured stroke so they keep a constant width */
/* Thin ring: continuous dark track; only the lit part is split into segments, with phosphor bloom */
/* 120 thin bars all round; the gaps are a background-coloured stroke so they stay a constant width */
/* Glow: a blurred copy of only the lit bars (fill only, no stroke) laid OVER the ring, so it also softly tints the dark gaps */
.dialin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
/* Phase pill: its colour + glow are pre-made textures (one per phase, made once at start-up), stacked behind the
   text and cross-faded with opacity only, so changing phase costs no repaint. Fallback colour if textures are missing. */
.phase{position:relative;z-index:0;display:flex;align-items:center;height:36px;box-sizing:border-box;padding:0 16px;border-radius:999px;background:var(--phase);color:var(--bg);
  font-family:var(--f-display);font-weight:800;font-size:20px;line-height:24px;letter-spacing:.1em;text-transform:uppercase}
.phase .pg{position:absolute;inset:0;z-index:-1;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .3s;will-change:opacity}
.phase .pg b{position:absolute;inset:-24px;z-index:-1;background-size:100% 100%;background-repeat:no-repeat}
.phase .pg.on{opacity:1}
.phase::before{content:none}
.big{font-size:clamp(60px,24cqw,92px);line-height:1;color:var(--fg)}
.big.warn{color:var(--phase,var(--fg))}
/* Next: the same card as the setup rows, just shorter */
.next{display:flex;align-items:center;gap:14px;padding:12px 18px;min-height:60px}
.next .val{margin-left:auto;font-size:30px;line-height:1}

/* Controls */
.controls{position:relative;height:68px;flex:none;display:flex;align-items:center;justify-content:center}
/* CTA: built from 3 pieces (left cap, right cap, middle) that only move/scale, so the pill <-> circle morph
   runs on the GPU with no layout work. The 4 pt bg gap + 1 pt ring are drawn by each piece. */
.cta{position:absolute;left:0;top:0;height:68px;width:100%;background:none;color:var(--bg);pointer-events:none;--dx:0px;--ring:#202021;
  font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:12px;
  touch-action:manipulation}
.cta>i{position:absolute;top:0;pointer-events:auto;will-change:transform;transition:transform .45s cubic-bezier(.3,.7,.2,1)}
.cta .cl,.cta .cr{width:68px;height:68px;border-radius:50%;background:var(--fg);box-shadow:0 0 0 4px var(--bg),0 0 0 5px var(--ring)}
.cta .cl{left:0}.cta .cr{right:0}
.cta .cm{left:34px;right:34px;top:-5px;height:78px;background:linear-gradient(var(--ring) 0 1px,var(--bg) 1px 5px,var(--fg) 5px 73px,var(--bg) 73px 77px,var(--ring) 77px)}
.cta.compact .cl{transform:translateX(var(--dx)) scale(.941)}
.cta.compact .cr{transform:translateX(calc(-1 * var(--dx))) scale(.941)}
.cta.compact .cm{transform:scale(0,.941)}
#ctaIcon,.cta-label{position:relative;z-index:1}
.cta.compact .cta-label{display:none}
.cta svg,.cta span{pointer-events:none}
#ctaIcon{display:flex;align-items:center}
.cta svg{width:24px;height:24px;flex:none;display:block}
.cta-label{display:block;padding-left:.14em;transform:translateY(1px)}
.reset{position:absolute;left:0;height:48px;padding:0 16px 0 13px;border-radius:24px;background:var(--panel);border:1px solid var(--line);
  font-family:var(--f-mono);font-weight:500;font-size:16px;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.reset svg{width:24px;height:24px}

/* Full-screen overlay (editor / sounds) */
.overlay{position:absolute;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:calc(14px + var(--sat));padding-bottom:max(20px,calc(var(--sab) - 2px))}
[hidden]{display:none!important}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:52px;border-bottom:1px solid var(--line)}
.nav h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.nav h2 i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--fg));box-shadow:0 0 16px color-mix(in srgb,var(--c,var(--fg)) 20%,transparent)}
.nav button{font-family:var(--f-mono);font-size:16px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:12px 0;color:var(--muted)}
.nav .go{justify-self:end;color:var(--yellow)}
.nav .back{justify-self:start}
.editor{flex:1;display:flex;align-items:center;justify-content:center;gap:14px;min-height:0}
.col{display:flex;align-items:center;gap:10px}
.unit{font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.wheelwrap{position:relative;--ih:72px;height:calc(var(--ih)*5);width:116px}
.wheelwrap::before{content:"";position:absolute;left:0;right:0;top:calc(var(--ih)*2 - 4px);height:calc(var(--ih) + 8px);
  background:var(--panel2);border-radius:999px;border:1px solid var(--c,var(--fg));pointer-events:none;
  box-shadow:0 0 16px color-mix(in srgb,var(--c,var(--fg)) 20%,transparent)}
.wheel{position:relative;height:100%;overflow:hidden;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none;
  -webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wheel .track{will-change:transform}
.wi{height:var(--ih);display:flex;align-items:center;justify-content:center;font-size:58px;line-height:1;user-select:none;cursor:pointer}
.hint{text-align:center}
.trow{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.trow .ttl{flex:1;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.trow .mono{display:block;margin-top:4px}
.toggle{width:52px;height:30px;border-radius:15px;background:var(--raise);border:1px solid var(--line);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.toggle[aria-checked="true"]{background:var(--green);box-shadow:0 0 16px color-mix(in srgb,var(--green) 20%,transparent)}
.toggle[aria-checked="true"]::after{transform:translateX(22px);background:var(--fg)}
.test{margin-top:18px;align-self:flex-start;font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:12px 18px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}

@media (max-height:700px){.wheelwrap{--ih:56px}.wi{font-size:44px}.hud .digits{font-size:44px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
/* iPhone home-screen app: fill the WHOLE screen, edge to edge (pinned to all 4 screen edges: never taller or shorter than the screen) */
@media (max-width:519px),(max-height:699px){body{display:block}.device{position:fixed;top:0;right:0;bottom:0;left:0;width:auto;height:auto}}
</style>
</head>
<body>

<div class="device" id="device">
<div class="ios-status" aria-hidden="true"><span>9:41</span><span class="notch"></span><svg viewBox="0 0 66 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="6" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/><path d="M30 3.5a9 9 0 0 1 11.5 0l-1.3 1.4a7 7 0 0 0-8.9 0zM32.6 6.3a5 5 0 0 1 6.3 0l-1.3 1.4a3 3 0 0 0-3.7 0zM35.75 9.2l1.5 1.6-1.5 1.5-1.5-1.5z"/><rect x="45.5" y="1" width="18" height="10" rx="3" fill="none" stroke="currentColor" opacity=".45"/><rect x="47.5" y="3" width="14" height="6" rx="1.5"/><rect x="64.5" y="4" width="1.5" height="4" rx=".75" opacity=".45"/></svg></div>
<div class="ios-home" aria-hidden="true"><i></i></div>
<div class="app gutter" id="app">
  <header>
    <div class="mark"><span class="bands" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="brand">Interval</span></div>
    <button class="icon-btn" id="soundBtn" aria-label="Sounds">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18.3 6.5a8 8 0 0 1 0 11"/></svg>
    </button>
  </header>

  <div class="views">
    <section class="view" id="home" aria-label="Workout setup">
      <div class="sec" id="secHead"><span class="mono">Loadout // Session</span></div>
      <div class="rows" id="rows"></div>
      <div class="foot" id="foot"><span class="mono">Total runtime</span><span class="total" id="homeTotal"></span></div>
    </section>

    <section class="view" id="run" hidden aria-live="polite" style="gap:12px">
      <div class="hud" id="hud">
        <div><span class="mono">Rounds left</span><span id="roundV"></span></div>
        <div><span class="mono">Cycles left</span><span id="cycleV"></span></div>
      </div>
      <div class="dialwrap"><canvas class="dial" id="dial" aria-hidden="true"></canvas>
        <i class="cn tl"></i><i class="cn tr"></i><i class="cn bl"></i><i class="cn br"></i>
        <span class="readout tl">SEQ <b id="seq">01/19</b></span><span class="readout tr" id="phCode">PH-00</span>
        <span class="readout bl">ELAPSED <b id="elapsed">00:00</b></span><span class="readout br">SIG <b>OK</b></span>
        <div class="dialin">
          <span class="phase" id="phaseName"><span id="phaseTxt">Prepare</span></span>
          <span class="big" id="bigTime"></span>
          <span class="mono" id="remaining"></span>
        </div>
      </div>
      <div class="next acard" id="nextBox"><span class="lab"><span class="name" id="nextName"></span></span><span class="val" id="nextTime"></span></div>
    </section>
  </div>

  <div class="controls">
    <button class="reset" id="resetBtn" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v4h4"/></svg>Reset</button>
    <button class="cta" id="cta"><i class="cl"></i><i class="cr"></i><i class="cm"></i><span id="ctaIcon"></span><span class="cta-label" id="ctaLabel">Start</span></button>
  </div>
</div>

<div class="overlay gutter" id="overlay" role="dialog" aria-modal="true" aria-labelledby="ovTitle" hidden>
  <div class="nav"><button class="back" id="ovBack">Back</button><h2 id="ovTitle">Work</h2><button class="go" id="ovDone">Done</button></div>
  <div id="ovBody" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
  <div class="mono hint" id="ovHint"></div>
</div>
</div>

<script>
const DEF={prep:5,work:7,rest:3,rounds:5,cycles:2,cycleRest:180,tick:true,beeps:true,voice:true};
const META={
  prep:{name:"Prepare",c:"--yellow",say:"Get ready",code:"PH-00"},
  work:{name:"Work",c:"--red",say:"Work",code:"PH-01"},
  rest:{name:"Rest",c:"--green",say:"Rest",code:"PH-02"},
  cycleRest:{name:"Rest macro",c:"--blue",say:"Rest macro",code:"PH-03"}
};
const FIELDS=[

function setPhase(type){if(type===curPhase)return;const prev=curPhase;curPhase=type;const k=type||"done";
  if(pillLayers){if(pillLayers[prev||"done"])pillLayers[prev||"done"].classList.remove("on");pillLayers[k].classList.add("on")}
  const v=type?"var("+META[type].c+")":"var(--fg)";$("phaseName").style.setProperty("--phase",v);$("bigTime").style.setProperty("--phase",v);
  dialCols.on=PHEX[k];dialKey="";}
let runKey="",nextVis=null,dialT=0,uiIdx=-1,uiStage=0;function setNextVis(v){if(v!==nextVis){nextVis=v;$("nextBox").style.visibility=v?"visible":"hidden"}}
let nextC="";function setNextC(v){if(v!==nextC){nextC=v;$("nextBox").style.setProperty("--c",v)}}
function renderRun(){
  const cur=Q[st.idx], nxt=Q[st.idx+1];
  if(st.done||!cur){
    setPhase(null);setText($("phaseTxt"),"Complete");setHTML($("bigTime"),digits("00:00"));$("bigTime").classList.remove("warn");setLit(0);setEdge(0);
    setHTML($("roundV"),digits("00"));setHTML($("cycleV"),digits("00"));
    setText($("remaining"),"Total "+fmt(totalOf(Q)));setNextVis(false);runKey="";return;
  }
  const remMs=cur.dur*1000-st.elapsed, rem=Math.ceil(remMs/1000);
  const key=st.idx+"|"+rem+"|"+st.started, changed=key!==runKey;
  /* 4. A phase change is spread over 3 frames: (1) sound + ring in the new colour, (2) pill + big time, (3) the rest. */
  if(st.idx!==uiIdx){if(st.running&&uiIdx>=0)uiStage=1;uiIdx=st.idx;dialCols.on=PHEX[cur.type];dialKey=""}
  const t=performance.now();
  if(!busy&&(changed||t-dialT>=32)){dialT=t;const f=N*Math.max(0,remMs)/(cur.dur*1000);setEdge(f)}   // ring: at most 30 times a second, only changed bars
  if(uiStage===1){uiStage=2;return}
  if(uiStage===2){uiStage=0;setPhase(cur.type);setText($("phaseTxt"),META[cur.type].name);
    setHTML($("bigTime"),digits(fmt(rem)));$("bigTime").classList.toggle("warn",st.started&&rem<=3);return}
  if(!changed)return;runKey=key;   // everything below runs once per second
  setPhase(cur.type);
  setText($("phaseTxt"),META[cur.type].name);
  setHTML($("bigTime"),digits(fmt(rem)));$("bigTime").classList.toggle("warn",st.started&&rem<=3);
  const cr=cur.type==="cycleRest";
  setHTML($("cycleV"),digits(pad(S.cycles-cur.cycle+(cr?0:1))));
  setHTML($("roundV"),digits(pad(cr?0:S.rounds-cur.round+1)));
  let left=remMs/1000;for(let i=st.idx+1;i<Q.length;i++)left+=Q[i].dur;
  setText($("remaining"),"Remaining "+fmt(Math.ceil(left)));
  setText($("seq"),pad(st.idx+1)+"/"+pad(Q.length));setText($("phCode"),META[cur.type].code);
  setText($("elapsed"),fmt(Math.floor(totalOf(Q)-left)));
  setNextVis(true);
  if(nxt){setNextC("var("+META[nxt.type].c+")");setText($("nextName"),META[nxt.type].name);setHTML($("nextTime"),digits(fmt(nxt.dur)))}
  else{setNextC("var(--fg)");setText($("nextName"),"Finish");setHTML($("nextTime"),"")}

/* ---------- Transitions: setup ⇄ dial ---------- */
const EASE="cubic-bezier(.2,.8,.2,1)";
const homeEls=()=>[$("secHead"),...$("rows").children,$("foot")];
async function bootDial(){
  // the ring appears already full, with a quick fade

  busy=false;

async function enterRun(){
  resetState();setPhase(Q[0].type);mode="run";renderControls();SFX.boot();
  if(!reduce){const anims=homeEls().map((el,i)=>el.animate([{opacity:1,transform:"none"},{opacity:0,transform:"translateX(-24px)"}],{duration:150,delay:i*25,easing:"ease-in",fill:"forwards"}));
    await Promise.all(anims.map(a=>a.finished));}
  $("home").hidden=true;homeEls().forEach(el=>el.getAnimations().forEach(a=>a.cancel()));
  $("run").hidden=false;renderRun();
  if(!reduce){$("hud").animate([{opacity:0,transform:"translateY(-10px)"},{opacity:1,transform:"none"}],{duration:240,easing:EASE});
    $("nextBox").animate([{opacity:0,transform:"translateY(10px)"},{opacity:1,transform:"none"}],{duration:240,delay:80,easing:EASE,fill:"backwards"});
    document.querySelector(".dialin").animate([{opacity:0,transform:"scale(.96)"},{opacity:1,transform:"none"}],{duration:260,easing:EASE});}
  await bootDial();
}
async function exitRun(){
  busy=true;st.running=false;releaseWake();try{speechSynthesis.cancel()}catch(e){}SFX.down();
  if(!reduce)await $("run").animate([{opacity:1},{opacity:0}],{duration:140,easing:"ease-in",fill:"forwards"}).finished;
  $("run").hidden=true;$("run").getAnimations().forEach(a=>a.cancel());
  mode="home";resetState();paintHome();$("home").hidden=false;renderControls();
  if(!reduce)homeEls().forEach((el,i)=>el.animate([{opacity:0,transform:"translateX(-24px)"},{opacity:1,transform:"none"}],{duration:200,delay:i*28,easing:EASE,fill:"backwards"}));
  busy=false;
}
$("cta").addEventListener("click",async()=>{
  if(busy)return;ensureAudio();
  if(mode==="home"){
    // start counting on the tap itself; the transition plays on top, so there is no wait before the timer runs
    const anim=enterRun();st.started=true;st.running=true;st.last=performance.now();st.tickT=0;announce(Q[0].type);holdWake();renderControls();await anim}
  else if(st.done)exitRun();
  else if(st.running){st.running=false;releaseWake();tabTone(RESET_TONE,.6);renderControls()}
  else{st.running=true;st.last=performance.now();holdWake();tabTone(START_TONE,.6);renderControls()}

$("resetBtn").addEventListener("click",()=>{if(!busy)exitRun()});
document.addEventListener("keydown",e=>{if(e.code==="Space"&&$("overlay").hidden){e.preventDefault();$("cta").click()}});

/* Wheel picker driven by pointer events (not native scroll): drag 1:1, flick with inertia, snap to a row.
   Native scroll-snap on iOS can lock after one row on the first swipe; this avoids that entirely. */
function makeWheel(values,label,c){
  const wrap=document.createElement("div");wrap.className="wheelwrap";wrap.style.setProperty("--c","var("+c+")");
  const w=document.createElement("div");w.className="wheel";w.tabIndex=0;w.setAttribute("role","spinbutton");w.setAttribute("aria-label",label);
  const track=document.createElement("div");track.className="track";
  track.innerHTML=values.map(v=>'<div class="wi">'+digits(pad(v))+'</div>').join("");w.appendChild(track);wrap.appendChild(w);
  const max=values.length-1, clamp=v=>Math.max(0,Math.min(max,v));
  const ih=()=>track.firstElementChild.offsetHeight||72;
  let pos=0,lastI=-1,anim=0;
  function paint(){
    const h=ih();track.style.transform="translate3d(0,"+((2-pos)*h).toFixed(2)+"px,0)";
    const kids=track.children,lo=Math.max(0,Math.floor(pos)-4),hi=Math.min(max,Math.ceil(pos)+4);
    for(let j=lo;j<=hi;j++){const d=Math.min(2.5,Math.abs(j-pos));kids[j].style.opacity=(1-d*.34).toFixed(2);kids[j].style.transform="scale("+(1-d*.1).toFixed(3)+")"}
    const i=clamp(Math.round(pos));if(lastI!==-1&&i!==lastI){SFX.ui();try{navigator.vibrate&&navigator.vibrate(4)}catch(e){}}lastI=i;
    w.setAttribute("aria-valuenow",values[i]);
  }
  function animateTo(target,ms){
    cancelAnimationFrame(anim);const from=pos,t0=performance.now();
    const step=now=>{const p=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-p,3);pos=from+(target-from)*e;paint();if(p<1)anim=requestAnimationFrame(step)};
    anim=requestAnimationFrame(step);
  }
  let drag=false,startY=0,startPos=0,moved=false,samples=[];
  w.addEventListener("pointerdown",e=>{
    cancelAnimationFrame(anim);drag=true;moved=false;startY=e.clientY;startPos=pos;samples=[[performance.now(),pos]];
    try{w.setPointerCapture(e.pointerId)}catch(_){}
  });
  w.addEventListener("pointermove",e=>{
    if(!drag)return;const dy=e.clientY-startY;if(Math.abs(dy)>3)moved=true;
    let p=startPos-dy/ih();if(p<0)p*=.35;else if(p>max)p=max+(p-max)*.35;   // soft rubber band at the ends
    pos=p;paint();const now=performance.now();samples.push([now,pos]);while(samples.length>2&&now-samples[0][0]>90)samples.shift();

  };

    if(e.key==="ArrowDown"){e.preventDefault();animateTo(clamp(Math.round(pos)+1),160)}
    if(e.key==="ArrowUp"){e.preventDefault();animateTo(clamp(Math.round(pos)-1),160)}});
  const api={el:wrap,paint,
    get(){return values[clamp(Math.round(pos))]},
    set(v,smooth){const i=Math.max(0,values.indexOf(v));if(smooth)animateTo(i,220);else{pos=i;paint()}}};
  return api;
}
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
function openEditor(f){

    const ed=document.createElement("div");ed.className="editor";body.appendChild(ed);
