<!doctype html>
<html lang="en">

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preload" href="fonts/Urbanist-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/JetBrainsMono-Medium.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Urbanist";src:url(fonts/Urbanist-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Urbanist";src:url(fonts/Urbanist-ExtraBold.woff2) format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url(fonts/JetBrainsMono-Medium.woff2) format("woff2");font-weight:400 600;font-display:swap}
[hidden]{display:none!important}
html,body{margin:0;overscroll-behavior:none}
html{background:#0b121a}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* Layout: retro-futurist field instrument. Home = big-number setup rows (tap → full-screen wheel editor).
   Start boots a 60-tick dial; Reset/Done powers it down back to the setup. Single deliberate dark look. */
:root{
  --k:1;   /* layout scale: 1 on phones, bigger on iPad / desktop (set by fitScreen() in JS) */
  color-scheme:dark;
  /* synced from Figma (Retro collection) */
  --bg:#0b121a; --panel:#1a202a; --panel2:#2d303b; --raise:#1c1e26; --fg:#efe6d2; --muted:#8c8984; --dim:#363533; --line:rgba(239,230,210,.09);
  --yellow:#f2b43c; --red:#ea5a3c; --green:#7cb86a; --blue:#5f93d6;
  --phase:var(--yellow);
  --f-display:"Urbanist","Avenir Next","Century Gothic",system-ui,sans-serif;
  --f-body:var(--f-display);
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
html,body{height:100%}
body{background:#0b121a;touch-action:manipulation;display:flex;align-items:center;justify-content:center;color:var(--fg);font-family:var(--f-body);font-size:15px;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);-webkit-tap-highlight-color:transparent;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,.wheel:focus-visible{outline:calc(2px*var(--k)) solid var(--yellow);outline-offset:calc(3px*var(--k))}
.gutter{padding-left:max(calc(18px*var(--k)),env(safe-area-inset-left,0px));padding-right:max(calc(18px*var(--k)),env(safe-area-inset-right,0px))}

.device{position:relative;width:100%;height:100%;overflow:hidden;container-type:inline-size;
  background:var(--bg)}
/* iOS safe areas. On a real phone the page itself is already inset by the system, so the frame adds nothing.
   In the desktop frame (and in .sim) we simulate an iPhone X: 44 pt status bar / notch area on top, 34 pt home-indicator area at the bottom. */
.device{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)} /* installed web app: real iPhone safe areas */
.ios-status,.ios-home{display:none}
.device.sim{--sat:44px;--sab:34px}.device.sim .ios-status,.device.sim .ios-home{display:flex}
.ios-status{position:absolute;left:0;right:0;top:0;height:44px;z-index:55;align-items:center;justify-content:space-between;padding:0 26px 0 32px;pointer-events:none;
  font:600 calc(15px*var(--k))/1 -apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--fg)}
.ios-status .notch{position:absolute;left:50%;top:0;width:150px;height:30px;margin-left:-75px;background:#000;border-radius:0 0 18px 18px}
.ios-status svg{height:12px;width:auto}
.ios-home{position:absolute;left:0;right:0;bottom:0;height:34px;z-index:55;align-items:center;justify-content:center;pointer-events:none}
.ios-home i{width:134px;height:5px;border-radius:3px;background:var(--fg);opacity:.9;margin-top:8px}
.app{height:100%;display:flex;flex-direction:column;padding-top:calc(calc(14px*var(--k)) + var(--sat));padding-bottom:max(calc(16px*var(--k)),calc(var(--sab) - calc(6px*var(--k))));gap:calc(14px*var(--k))}  /* ~28 pt above the screen edge on Face ID iPhones, like Figma */

/* Header with the four-band mark */
header{display:flex;align-items:center;justify-content:space-between;min-height:calc(44px*var(--k))}
.mark{display:flex;align-items:center;gap:calc(12px*var(--k))}
/* Logo mark (from Figma): four 30×4 bands, 3 apart, alternating 0 / +4 offset */
.bands{display:grid;grid-template-rows:repeat(4,calc(4px*var(--k)));gap:calc(3px*var(--k));width:calc(34px*var(--k))}
.bands i{display:block;width:calc(30px*var(--k));height:calc(4px*var(--k));border-radius:calc(2px*var(--k));--g:var(--yellow);box-shadow:0 0 calc(4px*var(--k)) color-mix(in srgb,var(--g) 20%,transparent)}
.bands i:nth-child(2){--g:var(--red)}.bands i:nth-child(3){--g:var(--green)}.bands i:nth-child(4){--g:var(--blue)}
.bands i:nth-child(2),.bands i:nth-child(4){margin-left:calc(4px*var(--k))}
.bands i:nth-child(1){background:var(--yellow)}.bands i:nth-child(2){background:var(--red)}.bands i:nth-child(3){background:var(--green)}.bands i:nth-child(4){background:var(--blue)}
.brand{font-family:var(--f-display);font-weight:800;font-size:calc(20px*var(--k));letter-spacing:.02em;line-height:1}
.brand small{display:block;font-family:var(--f-mono);font-weight:500;font-size:calc(9.5px*var(--k));letter-spacing:.18em;color:var(--muted);margin-top:calc(4px*var(--k))}
.icon-btn{width:calc(44px*var(--k));height:calc(44px*var(--k));border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
.icon-btn svg{width:calc(24px*var(--k));height:calc(24px*var(--k))}
.mono{font-family:var(--f-mono);font-size:calc(10px*var(--k));font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* Fixed-width digits so numbers never jitter, with a plain zero */
.digits{display:inline-flex;font-family:var(--f-display);font-weight:700;font-feature-settings:"tnum";letter-spacing:0}
.digits .d{display:inline-block;width:.6em;text-align:center}
.digits .c{display:inline-block;width:.28em;text-align:center}

.views{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
/* Responsive: content column centred, max width --maxw (set in JS); everything scales with --k */
.app,.overlay{--side:max(calc(18px*var(--k)),calc((100% - var(--maxw,9999px))/2 + calc(18px*var(--k))));padding-left:max(var(--side),env(safe-area-inset-left,0px));padding-right:max(var(--side),env(safe-area-inset-right,0px))}
/* Landscape (iPad / desktop / phone sideways): setup cards in 2 columns, run screen = dial left + info right */
.device.land .rows{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,minmax(0,1fr));grid-auto-flow:column}
.device.land .controls{width:100%;max-width:calc(460px*var(--k));margin-inline:auto;align-self:center}
.device.land #run{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto minmax(0,1fr);column-gap:calc(32px*var(--k))!important}
.device.land .hud{grid-column:2;grid-row:2}
.device.land .dialwrap{grid-column:1;grid-row:1/5}
.device.land .next{grid-column:2;grid-row:3}
.device.land .overlay{--maxw:calc(560px*var(--k))}

/* Home: big-number setup */
.sec{height:1px;flex:none;background:var(--line);margin-bottom:calc(12px*var(--k))}   /* plain hairline under the header */
.rows{flex:1;display:flex;flex-direction:column;gap:calc(8px*var(--k));min-height:0}
/* Card: dark panel, soft neutral stroke, full-height phase line on the left edge */
.acard{position:relative;overflow:hidden;border-radius:calc(10px*var(--k));border:1px solid var(--line);
  background:linear-gradient(160deg,color-mix(in srgb,var(--panel) 40%,transparent) 0%,color-mix(in srgb,var(--panel2) 40%,transparent) 100%)}
.acard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(4px*var(--k));background:var(--c);pointer-events:none;
  box-shadow:calc(16px*var(--k)) 0 calc(80px*var(--k)) var(--c)} /* soft wash of the phase colour into the card, clipped by the card */
.acard > *{position:relative}
.row{flex:1;min-height:calc(52px*var(--k));display:flex;align-items:center;gap:calc(14px*var(--k));text-align:left;padding:0 calc(16px*var(--k)) 0 calc(18px*var(--k));transition:border-color .2s,transform .15s,filter .2s}
.row:hover{filter:brightness(1.08)}
.row:active{transform:scale(.985)}
.row .tag{display:none}
.row .id{position:absolute;right:calc(12px*var(--k));top:calc(7px*var(--k));font-family:var(--f-mono);font-size:calc(8.5px*var(--k));letter-spacing:.16em;color:var(--muted);opacity:.7}
.row .lab,.next .lab{display:flex;flex-direction:column;gap:calc(3px*var(--k));min-width:0}
.row .name,.next .name{font-family:var(--f-display);font-weight:700;font-size:calc(20px*var(--k));letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.row .val{margin-left:auto;font-size:clamp(calc(32px*var(--k)),11cqw,calc(40px*var(--k)));line-height:1}
.row.count .val{color:var(--fg)}
.row.dim{opacity:.35}
.row .edit{width:calc(7px*var(--k));height:calc(12px*var(--k));color:var(--muted);flex:none;margin-left:calc(4px*var(--k))}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:calc(12px*var(--k));padding:calc(12px*var(--k)) calc(4px*var(--k)) 0;border-top:1px solid var(--line)}
.foot .total{font-size:calc(20px*var(--k));color:var(--fg)}

/* Run: HUD + dial */
.hud{display:grid;grid-template-columns:1fr 1fr;gap:calc(8px*var(--k))}
.hud > div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(4px*var(--k));padding:calc(14px*var(--k)) calc(12px*var(--k)) calc(12px*var(--k));text-align:center;border-radius:calc(10px*var(--k));border:1px solid var(--line);
  background:linear-gradient(160deg,color-mix(in srgb,var(--panel) 40%,transparent) 0%,color-mix(in srgb,var(--panel2) 40%,transparent) 100%)}
.hud .digits{font-size:calc(58px*var(--k));line-height:1}
.dialwrap{flex:1;min-height:0;position:relative;display:grid;place-items:center}
.dialwrap .cn{position:absolute;width:calc(18px*var(--k));height:calc(18px*var(--k));border-color:var(--dim);border-style:solid;border-width:0}
.cn.tl{left:0;top:0;border-left-width:1px;border-top-width:1px;border-top-left-radius:calc(6px*var(--k))}
.cn.tr{right:0;top:0;border-right-width:1px;border-top-width:1px;border-top-right-radius:calc(6px*var(--k))}
.cn.bl{left:0;bottom:0;border-left-width:1px;border-bottom-width:1px;border-bottom-left-radius:calc(6px*var(--k))}
.cn.br{right:0;bottom:0;border-right-width:1px;border-bottom-width:1px;border-bottom-right-radius:calc(6px*var(--k))}
.readout{position:absolute;font-family:var(--f-mono);font-size:calc(9.5px*var(--k));letter-spacing:.16em;color:var(--dim)}
/* readouts sit inside their corner bracket: clear of both arms, aligned to the bracket's inner edge */
.readout{line-height:calc(12px*var(--k));white-space:nowrap}
.readout.tl{left:calc(10px*var(--k));top:calc(8px*var(--k))}.readout.tr{right:calc(10px*var(--k));top:calc(8px*var(--k));text-align:right}.readout.bl{left:calc(10px*var(--k));bottom:calc(8px*var(--k))}.readout.br{right:calc(10px*var(--k));bottom:calc(8px*var(--k));text-align:right}
.readout b{color:var(--muted);font-weight:500}
.dial{position:absolute;inset:0;width:100%;height:100%}
/* Uniform square-cut segments; the gaps are a background-coloured stroke so they keep a constant width */
/* Thin ring: continuous dark track; only the lit part is split into segments, with phosphor bloom */
/* 120 thin bars all round; the gaps are a background-coloured stroke so they stay a constant width */
/* Glow: a blurred copy of only the lit bars (fill only, no stroke) laid OVER the ring, so it also softly tints the dark gaps */
.dialin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(8px*var(--k));text-align:center}
/* Phase pill: its colour + glow are pre-made textures (one per phase, made once at start-up), stacked behind the
   text and cross-faded with opacity only, so changing phase costs no repaint. Fallback colour if textures are missing. */
.phase{position:relative;z-index:0;display:flex;align-items:center;height:calc(36px*var(--k));box-sizing:border-box;padding:0 calc(16px*var(--k));border-radius:calc(999px*var(--k));background:var(--phase);color:var(--bg);
  font-family:var(--f-display);font-weight:800;font-size:calc(20px*var(--k));line-height:calc(24px*var(--k));letter-spacing:.1em;text-transform:uppercase}
.phase .pg{position:absolute;inset:0;z-index:-1;border-radius:calc(999px*var(--k));pointer-events:none;opacity:0;transition:opacity .3s;will-change:opacity}
.phase .pg b{position:absolute;inset:calc(-24px*var(--k));z-index:-1;background-size:100% 100%;background-repeat:no-repeat}
.phase .pg.on{opacity:1}
.phase::before{content:none}
.big{font-size:clamp(calc(60px*var(--k)),24cqw,calc(92px*var(--k)));line-height:1;color:var(--fg)}
.big.warn{color:var(--phase,var(--fg))}
/* Next: the same card as the setup rows, just shorter */
.next{display:flex;align-items:center;gap:calc(14px*var(--k));padding:calc(12px*var(--k)) calc(18px*var(--k));min-height:calc(60px*var(--k));color:var(--muted)}
.next .val{margin-left:auto;font-size:calc(30px*var(--k));line-height:1}

/* Controls */
.controls{position:relative;height:calc(68px*var(--k));flex:none;display:flex;align-items:center;justify-content:center}
/* CTA: built from 3 pieces (left cap, right cap, middle) that only move/scale, so the pill <-> circle morph
   runs on the GPU with no layout work. The 4 pt bg gap + 1 pt ring are drawn by each piece. */
.cta{position:absolute;left:0;top:0;height:calc(68px*var(--k));width:100%;background:none;color:var(--bg);pointer-events:none;--dx:0px;--ring:#20252b;
  font-family:var(--f-display);font-weight:800;font-size:calc(22px*var(--k));line-height:1;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:calc(12px*var(--k));
  touch-action:manipulation}
.cta>i{position:absolute;top:0;pointer-events:auto;will-change:transform;transition:transform .45s cubic-bezier(.3,.7,.2,1)}
.cta .cl,.cta .cr{width:calc(68px*var(--k));height:calc(68px*var(--k));border-radius:50%;background:var(--fg);box-shadow:0 0 0 calc(4px*var(--k)) var(--bg),0 0 0 calc(5px*var(--k)) var(--ring)}
.cta .cl{left:0}.cta .cr{right:0}
.cta .cm{left:calc(34px*var(--k));right:calc(34px*var(--k));top:calc(-5px*var(--k));height:calc(78px*var(--k));background:linear-gradient(var(--ring) 0 1px,var(--bg) 1px calc(5px*var(--k)),var(--fg) calc(5px*var(--k)) calc(73px*var(--k)),var(--bg) calc(73px*var(--k)) calc(77px*var(--k)),var(--ring) calc(77px*var(--k)))}
.cta.compact .cl{transform:translateX(var(--dx)) scale(.941)}
.cta.compact .cr{transform:translateX(calc(-1 * var(--dx))) scale(.941)}
.cta.compact .cm{transform:scale(0,.941)}
#ctaIcon,.cta-label{position:relative;z-index:1}
.cta.compact .cta-label{display:none}
.cta svg,.cta span{pointer-events:none}
#ctaIcon{display:flex;align-items:center}
.cta svg{width:calc(24px*var(--k));height:calc(24px*var(--k));flex:none;display:block}
.cta-label{display:block;padding-left:.14em;transform:translateY(1px)}
.reset{position:absolute;left:0;width:calc(48px*var(--k));height:calc(48px*var(--k));padding:0;justify-content:center;border-radius:50%;background:var(--panel);border:1px solid var(--line);
  font-family:var(--f-mono);font-weight:500;font-size:calc(16px*var(--k));letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:calc(6px*var(--k))}
.reset svg{width:calc(24px*var(--k));height:calc(24px*var(--k))}

/* Full-screen overlay (editor / sounds) */
.overlay{position:absolute;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:calc(calc(14px*var(--k)) + var(--sat));padding-bottom:max(calc(20px*var(--k)),calc(var(--sab) - calc(2px*var(--k))))}
[hidden]{display:none!important}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:calc(52px*var(--k));border-bottom:1px solid var(--line)}
.nav h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:calc(17px*var(--k));letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:calc(10px*var(--k))}
.nav h2 i{width:calc(10px*var(--k));height:calc(10px*var(--k));border-radius:50%;background:var(--c,var(--fg));box-shadow:0 0 calc(16px*var(--k)) color-mix(in srgb,var(--c,var(--fg)) 20%,transparent)}
.nav button{font-family:var(--f-mono);font-size:calc(16px*var(--k));font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:calc(12px*var(--k)) 0;color:var(--muted)}
.nav .go{justify-self:end;color:var(--yellow)}
.nav .back{justify-self:start}
.editor{flex:1;display:flex;align-items:center;justify-content:center;gap:calc(14px*var(--k));min-height:0}
.col{display:flex;align-items:center;gap:calc(10px*var(--k))}
.unit{font-family:var(--f-mono);font-size:calc(12px*var(--k));letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.wheelwrap{position:relative;--ih:calc(72px*var(--k));height:calc(var(--ih)*5);width:calc(116px*var(--k))}
.wheelwrap::before{content:"";position:absolute;left:0;right:0;top:calc(var(--ih)*2 - calc(4px*var(--k)));height:calc(var(--ih) + calc(8px*var(--k)));
  background:var(--panel2);border-radius:calc(999px*var(--k));border:1px solid var(--c,var(--fg));pointer-events:none;
  box-shadow:0 0 calc(16px*var(--k)) color-mix(in srgb,var(--c,var(--fg)) 20%,transparent)}
.wheel{position:relative;height:100%;overflow:hidden;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none;
  -webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wheel .track{will-change:transform}
.wi{height:var(--ih);display:flex;align-items:center;justify-content:center;font-size:calc(58px*var(--k));line-height:1;user-select:none;cursor:pointer}
.hint{text-align:center}
.trow{display:flex;align-items:center;gap:calc(14px*var(--k));padding:calc(16px*var(--k)) 0;border-bottom:1px solid var(--line)}
.trow .ttl{flex:1;font-family:var(--f-display);font-weight:700;font-size:calc(16px*var(--k));letter-spacing:.06em;text-transform:uppercase}
.trow .mono{display:block;margin-top:calc(4px*var(--k))}
/* Sound options fold away when the master "Sounds" switch is off */
.fold{display:grid;grid-template-rows:1fr;opacity:1;transition:grid-template-rows .26s cubic-bezier(.3,.7,.2,1),opacity .2s}
.fold>div{overflow:hidden;min-height:0}
.fold.shut{grid-template-rows:0fr;opacity:0}
.toggle{width:calc(52px*var(--k));height:calc(30px*var(--k));border-radius:calc(15px*var(--k));background:var(--raise);border:1px solid var(--line);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:calc(3px*var(--k));left:calc(3px*var(--k));width:calc(22px*var(--k));height:calc(22px*var(--k));border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.toggle[aria-checked="true"]{background:var(--green);box-shadow:0 0 calc(16px*var(--k)) color-mix(in srgb,var(--green) 20%,transparent)}
.toggle[aria-checked="true"]::after{transform:translateX(calc(22px*var(--k)));background:var(--fg)}
.test{margin-top:calc(18px*var(--k));align-self:flex-start;font-family:var(--f-mono);font-size:calc(12px*var(--k));letter-spacing:.14em;text-transform:uppercase;padding:calc(12px*var(--k)) calc(18px*var(--k));border:1px solid var(--line);border-radius:calc(999px*var(--k));background:var(--panel)}

@media (max-height:700px){.wheelwrap{--ih:calc(56px*var(--k))}.wi{font-size:calc(44px*var(--k))}.hud .digits{font-size:calc(44px*var(--k))}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
/* iPhone home-screen app: fill the WHOLE screen, edge to edge (pinned to all 4 screen edges: never taller or shorter than the screen) */
body{display:block}.device{position:fixed;top:0;right:0;bottom:0;left:0;width:auto;height:auto}
</style>
</head>

<div class="device" id="device">

<script>
const DEF={prep:5,work:7,rest:3,rounds:5,cycles:2,cycleRest:180,tick:true,beeps:true,voice:true,sfx:true};
const META={
  prep:{name:"Prepare",c:"--yellow",say:"Get ready",code:"PH-00"},
  work:{name:"Work",c:"--red",say:"Work",code:"PH-01"},
  rest:{name:"Rest",c:"--green",say:"Rest",code:"PH-02"},
  cycleRest:{name:"Rest macro",c:"--blue",say:"Rest macro",code:"PH-03"}
};
const FIELDS=[
  {k:"prep",idc:"T-01",name:"Prepare",c:"--yellow",time:true,min:0,code:"Countdown",hint:"00:00 skips it"},
  {k:"work",idc:"T-02",name:"Work",c:"--red",time:true,min:1,code:"Effort",hint:"Minimum 1 second"},
  {k:"rest",idc:"T-03",name:"Rest",c:"--green",time:true,min:0,code:"Between rounds",hint:"Not after the last round"},
  {k:"rounds",idc:"N-01",name:"Rounds",c:"--fg",min:1,max:50,code:"Work + rest",hint:"Per cycle"},
  {k:"cycles",idc:"N-02",name:"Cycles",c:"--fg",min:1,max:20,code:"All rounds",hint:"Repeats the whole block"},
  {k:"cycleRest",idc:"T-04",name:"Rest macro",c:"--blue",time:true,min:0,code:"Between cycles",hint:"Only with 2+ cycles"}
];
const $=id=>document.getElementById(id);
const rootStyle=document.documentElement.style;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let S=load(), Q=[], st={}, mode="home", busy=false;
function load(){try{const s=JSON.parse(localStorage.getItem("itimer-v3"));if(s)return {...DEF,...s}}catch(e){}return {...DEF}}
function persist(){try{localStorage.setItem("itimer-v3",JSON.stringify(S))}catch(e){}}
function build(s){
  const q=[];
  if(s.prep>0)q.push({type:"prep",dur:s.prep,cycle:1,round:1});
  for(let c=1;c<=s.cycles;c++){
    for(let r=1;r<=s.rounds;r++){q.push({type:"work",dur:s.work,cycle:c,round:r});if(r<s.rounds&&s.rest>0)q.push({type:"rest",dur:s.rest,cycle:c,round:r})}
    if(c<s.cycles&&s.cycleRest>0)q.push({type:"cycleRest",dur:s.cycleRest,cycle:c,round:s.rounds});
  }
  return q;
}
const pad=n=>String(n).padStart(2,"0");
const fmt=sec=>{sec=Math.max(0,Math.round(sec));return pad(Math.floor(sec/60))+":"+pad(sec%60)};
const totalOf=q=>q.reduce((a,x)=>a+x.dur,0);
const digits=str=>'<span class="digits">'+[...str].map(ch=>ch===":"?'<span class="c">:</span>':'<span class="d">'+ch+'</span>').join("")+'</span>';
const setHTML=(el,html)=>{if(el.dataset.h!==html){el.innerHTML=html;el.dataset.h=html}};
const setText=(el,t)=>{if(el.textContent!==t)el.textContent=t};

/* ---------- Home ---------- */
const CHEV='<svg class="edit" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m1 1 6 6-6 6"/></svg>';
FIELDS.forEach(f=>{
  const b=document.createElement("button");b.className="row acard"+(f.time?"":" count");b.id="row-"+f.k;b.style.setProperty("--c","var("+f.c+")");
  b.innerHTML='<span class="tag"></span><span class="lab"><span class="name">'+f.name+'</span><span class="mono">'+f.code+'</span></span><span class="val"></span>'+CHEV+'<span class="id">'+f.idc+'</span>';
  b.addEventListener("click",()=>openEditor(f));$("rows").appendChild(b);
});
function paintHome(){
  FIELDS.forEach(f=>{const b=$("row-"+f.k);setHTML(b.querySelector(".val"),digits(f.time?fmt(S[f.k]):pad(S[f.k])));
    b.setAttribute("aria-label",f.name+" "+(f.time?fmt(S[f.k]):S[f.k])+". Edit");
    b.classList.toggle("dim",!!((f.k==="cycleRest"&&S.cycles<2)||(f.time&&f.k!=="work"&&S[f.k]===0)));});
  setHTML($("homeTotal"),digits(fmt(totalOf(build(S)))));
}

/* ---------- Analog-style synth SFX ---------- */
const MASTER=.38;
/* "Sounds" master switch: every effect (timer cues AND interaction sounds) goes through the master bus; it also silences the voice */
const masterLevel=()=>S.sfx?MASTER:0;
function setMaster(){if(master&&actx)master.gain.setTargetAtTime(masterLevel()*(ducked?.4:1),actx.currentTime,.02);if(vbus&&actx)vbus.gain.setTargetAtTime(S.sfx?VOICE_LEVEL:0,actx.currentTime,.02)}
let ducked=false;
let actx=null, master=null, tickAlt=false, voiceUnlocked=false;
function ensureAudio(){
  try{if(navigator.audioSession&&navigator.audioSession.type!=="playback")navigator.audioSession.type="playback"}catch(e){}
  try{
    if(!actx||actx.state==="closed"){
      actx=new (window.AudioContext||window.webkitAudioContext)();
      // gentle tape-style saturation + master level
      const shaper=actx.createWaveShaper(),curve=new Float32Array(1024);
      for(let i=0;i<1024;i++){const x=i/512-1;curve[i]=Math.tanh(1.6*x)/Math.tanh(1.6)}
      // master bus: saturation → compressor (evens out the levels) → master gain kept well under the voice
      shaper.curve=curve;const comp=actx.createDynamicsCompressor();
      comp.threshold.value=-24;comp.knee.value=12;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.15;
      master=actx.createGain();master.gain.value=masterLevel();shaper.connect(comp).connect(master).connect(actx.destination);master._in=shaper;
    }
    if(actx.state!=="running")actx.resume().catch(()=>{});
    const b=actx.createBuffer(1,1,22050),s=actx.createBufferSource();s.buffer=b;s.connect(actx.destination);s.start(0);
    prerender();loadVoice();
  }catch(e){}
}
["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,ensureAudio,{capture:true,passive:true}));
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&actx&&actx.state!=="running")actx.resume().catch(()=>{})});
/* One voice: two slightly detuned oscillators → resonant low-pass with its own envelope → amp envelope */
let REC=null;   // when set, blip() draws into an offline context (pre-rendering) instead of playing live
function blip({f=440,f2=null,type="square",dur=.12,vol=.2,cut=2400,cut2=null,q=6,detune=7,at=0,glide=null}){
  const ctx=REC?REC.ctx:actx, out=REC?REC.ctx.destination:master&&master._in;
  if(!ctx||!out||(!REC&&!S.sfx))return;if(!REC&&actx.state!=="running")actx.resume().catch(()=>{});
  const t=(REC?0:actx.currentTime)+at, g=ctx.createGain(), lp=ctx.createBiquadFilter();
  lp.type="lowpass";lp.Q.value=q;lp.frequency.setValueAtTime(cut,t);if(cut2)lp.frequency.exponentialRampToValueAtTime(cut2,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  lp.connect(g).connect(out);
  for(const d of [-detune,detune]){const o=ctx.createOscillator();o.type=type;o.detune.value=d;o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+(glide||dur));o.connect(lp);o.start(t);o.stop(t+dur+.03)}
}
/* Timer sounds, defined once. They are pre-rendered into audio buffers at the first tap, so during the workout
   playing one is a single buffer node instead of building oscillators and filters at that exact moment. */
const SYNTH={
  tickA:[.06,()=>blip({f:1900,type:"square",dur:.028,vol:.06,cut:3200,q:2,detune:0})],
  tickB:[.06,()=>blip({f:1750,type:"square",dur:.028,vol:.06,cut:3200,q:2,detune:0})],
  count:[.22,()=>blip({f:587,f2:600,type:"square",dur:.16,vol:.22,cut:3000,cut2:900,q:9})],
  count1:[.22,()=>blip({f:880,f2:900,type:"square",dur:.16,vol:.22,cut:3000,cut2:900,q:9})],
  work:[.42,()=>[523,659,784].forEach((f,i)=>blip({f,type:"sawtooth",dur:.18,vol:.16,cut:1200,cut2:4200,q:7,at:i*.07}))],
  rest:[.48,()=>[784,659,523].forEach((f,i)=>blip({f,type:"triangle",dur:.22,vol:.2,cut:2600,cut2:700,q:5,at:i*.08}))],
  macro:[.68,()=>{blip({f:196,f2:392,type:"sawtooth",dur:.6,vol:.16,cut:400,cut2:2600,q:12,glide:.45});blip({f:294,f2:588,type:"square",dur:.6,vol:.08,cut:500,cut2:2000,q:8,glide:.45})}],
  prep:[.34,()=>blip({f:330,f2:660,type:"square",dur:.28,vol:.14,cut:800,cut2:3200,q:10})],
  done:[.88,()=>[392,523,659,1046].forEach((f,i)=>blip({f,type:"square",dur:.5,vol:.12,cut:900,cut2:3600,q:8,at:i*.09}))]
};
const BUF={};let prerendered=false;
function prerender(){if(prerendered||!actx)return;prerendered=true;
  const OC=window.OfflineAudioContext||window.webkitOfflineAudioContext;if(!OC)return;
  Object.keys(SYNTH).forEach((k,i)=>setTimeout(()=>{try{   // one per task, so the first tap stays instant
    const [dur,fn]=SYNTH[k],sr=actx.sampleRate,oc=new OC(1,Math.ceil(sr*dur),sr);
    REC={ctx:oc};try{fn()}finally{REC=null}
    const done=b=>{if(b)BUF[k]=b};const pr=oc.startRendering();if(pr&&pr.then)pr.then(done).catch(()=>{});else oc.oncomplete=e=>done(e.renderedBuffer);
  }catch(e){REC=null}},30*i))}
function play(k){
  if(!actx||!master||!S.sfx)return;if(actx.state!=="running")actx.resume().catch(()=>{});
  const b=BUF[k];if(!b){SYNTH[k][1]();return}   // not ready yet: synthesize live (same sound)
  const src=actx.createBufferSource();src.buffer=b;src.connect(master._in);src.start()}
const SFX={
  tick(){tickAlt=!tickAlt;play(tickAlt?"tickA":"tickB")},
  count(n){play(n===1?"count1":"count")},
  work(){play("work")},
  rest(){play("rest")},
  macro(){play("macro")},
  prep(){play("prep")},
  boot(){tabTone(START_TONE,1)},
  reset(){tabTone(RESET_TONE,1)},
  down(){tabTone(RESET_TONE,1)},
  done(){play("done")},
  ui(){tabTone(TICK_TONE,.55)},
  toggle(on){tabTone(on?TOGGLE_ON:TOGGLE_OFF,.7)}
};
const phaseSfx={prep:"prep",work:"work",rest:"rest",cycleRest:"macro"};
/* Menu-tab tone, modelled on the analysed reference: a soft rounded tone ~610 Hz with a quieter partial ~330 Hz,
   ~4 ms attack, ~50 ms hold, quick release, and a short drop toward ~400 Hz at the tail. No noise, no click.
   Reset uses the same voice a little lower and gently falling, so it reads as "going back". */
const START_TONE={f:660,sub:330,tail:620,hold:.018,rel:.016,cut:5600,bright:.22}; /* drier + more open */
const TICK_TONE={f:980,sub:490,tail:940,hold:.006,rel:.012,cut:6000,bright:.15};   /* wheels */
const TOGGLE_ON={f:720,sub:360,tail:760,hold:.012,rel:.014,cut:5200,bright:.18};
const TOGGLE_OFF={f:560,sub:290,tail:500,hold:.012,rel:.018,cut:3600,bright:.08};
const RESET_TONE={f:520,sub:280,tail:350,hold:.045,rel:.035,fall:.94};
function tabTone(p,level=1){
  if(!actx||!master||!S.sfx)return;if(actx.state!=="running")actx.resume().catch(()=>{});
  const t=actx.currentTime, end=t+.004+p.hold+p.rel;
  const lp=actx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=p.cut||2600;lp.Q.value=.7;
  const g=actx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.42*level,t+.004);
  g.gain.setValueAtTime(.42*level,t+.004+p.hold);g.gain.exponentialRampToValueAtTime(.0001,end);
  lp.connect(g).connect(master._in);
  const voice=(type,f,amp)=>{const o=actx.createOscillator(),og=actx.createGain();o.type=type;
    o.frequency.setValueAtTime(f,t);if(p.fall)o.frequency.exponentialRampToValueAtTime(f*p.fall,t+.004+p.hold);
    o.frequency.exponentialRampToValueAtTime(f*(p.tail/p.f),end);og.gain.value=amp;o.connect(og).connect(lp);o.start(t);o.stop(end+.02)};
  voice("triangle",p.f,1);voice("sine",p.sub,.45);if(p.bright)voice("square",p.f,p.bright);
}
/* Tactile menu press: a muffled low "thock" (body) + a short band-passed noise click (contact) */
let noiseBuf=null;
function press(level=1){
  if(!actx||!master||!S.sfx)return;if(actx.state!=="running")actx.resume().catch(()=>{});
  const t=actx.currentTime;
  if(!noiseBuf){noiseBuf=actx.createBuffer(1,actx.sampleRate*.05,actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3)}
  const o=actx.createOscillator(),og=actx.createGain();o.type="sine";
  o.frequency.setValueAtTime(210,t);o.frequency.exponentialRampToValueAtTime(95,t+.07);
  og.gain.setValueAtTime(.0001,t);og.gain.exponentialRampToValueAtTime(.55*level,t+.004);og.gain.exponentialRampToValueAtTime(.0001,t+.11);
  o.connect(og).connect(master._in);o.start(t);o.stop(t+.13);
  const n=actx.createBufferSource(),bp=actx.createBiquadFilter(),ng=actx.createGain();n.buffer=noiseBuf;
  bp.type="bandpass";bp.frequency.value=2600;bp.Q.value=1.4;ng.gain.value=.35*level;
  n.connect(bp).connect(ng).connect(master._in);n.start(t);
}
/* Voice: pick the most natural English voice the device offers (Premium / Enhanced / Natural / Neural first) */
/* Voice: recorded clips bundled in the app (same voice on every device, no iOS speech engine → no freezes).

    if(vSrc)try{vSrc.stop()}catch(e){}

/* The next word is spoken by its own timer, set when a phase starts or resumes: it fires on time even if a frame is late.

let voiceTimer=0,voiceFor=-1;

  if(!st.running||!S.voice||!S.sfx||st.idx>=Q.length){if(voiceFor!==-1){clearTimeout(voiceTimer);voiceFor=-1}return}
  if(voiceFor===st.idx)return;clearTimeout(voiceTimer);voiceFor=st.idx;

   It is started inside the Start/Resume tap, and restarted if iOS pauses it (app switch, call, etc.). */
let keepVid=null,keepOn=false;
function keepAwakeVideo(on){
  keepOn=on;

    if(!keepVid){keepVid=document.createElement("video");keepVid.setAttribute("title","Interval");keepVid.setAttribute("playsinline","");
      keepVid.setAttribute("webkit-playsinline","");keepVid.preload="auto";keepVid.src="keepawake-a.mp4";
      keepVid.style.cssText="position:absolute;left:-100%;top:-100%;width:16px;height:16px;pointer-events:none";
      keepVid.addEventListener("timeupdate",()=>{if(keepVid.currentTime>3)keepVid.currentTime=Math.random()*.5});   // never reaches the end
      keepVid.addEventListener("pause",()=>{if(keepOn)setTimeout(()=>{if(keepOn&&keepVid.paused)keepVid.play().catch(()=>{})},400)});
      document.body.appendChild(keepVid)}

  const s=Math.min(W,H)/300,edge=dialLit-1,frac=step/12,base=dialCols.on+"|"+dialCols.off+"|"+W;
  dctx.lineWidth=2.6*s;dctx.strokeStyle=dialCols.bg;dctx.lineJoin="miter";
  if(base!==dialBase){dialBase=base;dialPainted=[];if(W+"x"+H!==dialSizeKey){dialSizeKey=W+"x"+H;dctx.clearRect(0,0,W,H)}}
  /* At most 40 bars per frame: a phase change (all 120 bars change colour) is spread over 3 frames
     instead of one heavy frame right when the sounds play. */
  let budget=40;
  for(let i=0;i<N;i++){
    const c=i<dialLit?(i===edge&&frac>0&&frac<1&&/^#/.test(dialCols.on)?mix(dialCols.on,dialCols.off,frac):dialCols.on):dialCols.off;
    if(c===dialPainted[i])continue;
    if(budget--<=0){dialKey="";if(!dialMore){dialMore=true;requestAnimationFrame(()=>{dialMore=false;drawDial()})}return}
    dialPainted[i]=c;const p=dialPaths[i];
    dctx.fillStyle=dialCols.bg;dctx.fill(p);   // wipe the old colour (incl. its soft edge) before repainting this bar
    dctx.fillStyle=c;dctx.fill(p);dctx.stroke(p)}
}
function drawGlow(){sizeDial();dialColors();drawDial()}   /* kept name: (re)measure + redraw */
/* Fit any screen: phones keep the designed size (k = 1), iPad / desktop scale up, landscape gets its own layout */
function fitScreen(){const d=$("device"),w=d.clientWidth,h=d.clientHeight;if(!w||!h)return;
  const land=w>h*1.05&&w>=560;let k=land?Math.min(w/900,h/700):Math.min(w/390,h/844);
  k=land?Math.max(.6,Math.min(1.5,k)):Math.max(1,Math.min(1.6,k));
  document.documentElement.style.setProperty("--k",k.toFixed(3));d.classList.toggle("land",land);
  d.style.setProperty("--maxw",land?Math.round(1000*k)+"px":"9999px");   // portrait: full width, only the normal side gutter
  sizeDial();dialKey="";drawDial();sizeCta()}
addEventListener("resize",fitScreen);addEventListener("orientationchange",()=>setTimeout(fitScreen,250));
function setLit(n){dialLit=n;dialEdge=n;drawDial()}
function setEdge(f){dialLit=Math.ceil(f);dialEdge=f;drawDial()}

/* ---------- Timer ---------- */
function resetState(){runKey="";uiIdx=-1;uiStage=0;Q=build(S);st={idx:0,elapsed:0,running:false,started:false,done:false,last:0,lastRem:null,tickT:0}}
function loop(now){
  if(st.running){
    const dt=now-st.last;st.elapsed+=dt;st.last=now;st.tickT+=dt;
    let changed=false;
    while(st.idx<Q.length&&st.elapsed>=Q[st.idx].dur*1000){st.elapsed-=Q[st.idx].dur*1000;st.idx++;changed=true;st.lastRem=null}
    if(st.idx>=Q.length)finish();
    else{
      if(changed)announce(Q[st.idx].type);
      scheduleVoice();preSpeak();
      const rem=Math.ceil((Q[st.idx].dur*1000-st.elapsed)/1000);
      if(rem!==st.lastRem){if(st.lastRem!==null&&rem<=3&&rem>=1&&S.beeps)SFX.count(rem);st.lastRem=rem}
      if(st.tickT>=500){st.tickT%=500;if(S.tick)SFX.tick()}
    }
    renderRun();
  }else if(voiceFor!==-1)scheduleVoice();   // paused/stopped: cancel the pending voice timer
  requestAnimationFrame(loop);
}
function finish(){st.running=false;st.done=true;st.idx=Q.length;releaseWake();SFX.done();if(st.spoken!==Q.length)speak("done","Workout complete");renderRun();renderControls()}
let curPhase="?";
/* Phase colours, read once. Changing phase now touches only the pill layers, the big time and the ring. */
const PHEX={};let pillLayers=null;
function readPhaseColors(){const cs=getComputedStyle(document.documentElement);
  Object.keys(META).forEach(k=>PHEX[k]=cs.getPropertyValue(META[k].c).trim());PHEX.done=cs.getPropertyValue("--fg").trim()}
function makePillTextures(){try{   // one soft glow image per phase colour (= CSS box-shadow 0 0 16px @20%), made once
  const pill=$("phaseName"),dpr=Math.min(3,window.devicePixelRatio||1),H=36,M=24,W=H*4,cw=(W+2*M)*dpr,ch=(H+2*M)*dpr,off=cw+50;
  pillLayers={};
  Object.keys(PHEX).forEach(k=>{const c=document.createElement("canvas");c.width=cw;c.height=ch;const x=c.getContext("2d"),hex=PHEX[k];
    const rgb=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)),r=H/2*dpr,X=M*dpr-off,Y=M*dpr,w=W*dpr,h=H*dpr;
    x.shadowColor="rgba("+rgb.join(",")+",.2)";x.shadowBlur=16*dpr;x.shadowOffsetX=off;x.fillStyle="#000";   // shape drawn off-canvas: only its glow lands
    x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();x.fill();
    const g=document.createElement("i"),gl=document.createElement("b");g.className="pg";g.style.backgroundColor=hex;
    gl.style.backgroundImage="url("+c.toDataURL()+")";g.appendChild(gl);pill.appendChild(g);pillLayers[k]=g});
}catch(e){pillLayers=null}}
function setPhase(type){if(type===curPhase)return;const prev=curPhase;curPhase=type;const k=type||"done";
  if(pillLayers){if(pillLayers[prev||"done"])pillLayers[prev||"done"].classList.remove("on");pillLayers[k].classList.add("on")}
  const v=type?"var("+META[type].c+")":"var(--fg)";$("phaseName").style.setProperty("--phase",v);$("bigTime").style.setProperty("--phase",v);
  dialCols.on=PHEX[k];dialKey="";}
let runKey="",nextVis=null,dialT=0,uiIdx=-1,uiStage=0;function setNextVis(v){if(v!==nextVis){nextVis=v;$("nextBox").style.visibility=v?"visible":"hidden"}}
let nextC="";function setNextC(v){if(v!==nextC){nextC=v;$("nextBox").style.setProperty("--c",v)}}
function renderRun(){
  const cur=Q[st.idx], nxt=Q[st.idx+1];
  if(st.done||!cur){
    setPhase(null);setText($("phaseTxt"),"Complete");setHTML($("bigTime"),digits("00:00"));$("bigTime").classList.remove("warn");setLit(0);setEdge(0);
    setHTML($("roundV"),digits("00"));setHTML($("cycleV"),digits("00"));
    setText($("remaining"),"Total "+fmt(totalOf(Q)));setNextVis(false);runKey="";return;
  }
  const remMs=cur.dur*1000-st.elapsed, rem=Math.ceil(remMs/1000);
  const key=st.idx+"|"+rem+"|"+st.started, changed=key!==runKey;
  /* 4. A phase change is spread over 3 frames: (1) sound + ring in the new colour, (2) pill + big time, (3) the rest. */
  if(st.idx!==uiIdx){if(st.running&&uiIdx>=0)uiStage=1;uiIdx=st.idx;dialCols.on=PHEX[cur.type];dialKey=""}
  const t=performance.now();
  if(!busy&&(changed||t-dialT>=32)){dialT=t;const f=N*Math.max(0,remMs)/(cur.dur*1000);setEdge(f)}   // ring: at most 30 times a second, only changed bars
  if(uiStage===1){uiStage=2;return}
  if(uiStage===2){uiStage=0;setPhase(cur.type);setText($("phaseTxt"),META[cur.type].name);
    setHTML($("bigTime"),digits(fmt(rem)));$("bigTime").classList.toggle("warn",st.started&&rem<=3);return}
  if(!changed)return;runKey=key;   // everything below runs once per second
  setPhase(cur.type);
  setText($("phaseTxt"),META[cur.type].name);
  setHTML($("bigTime"),digits(fmt(rem)));$("bigTime").classList.toggle("warn",st.started&&rem<=3);
  const cr=cur.type==="cycleRest";
  setHTML($("cycleV"),digits(pad(S.cycles-cur.cycle+(cr?0:1))));
  setHTML($("roundV"),digits(pad(cr?0:S.rounds-cur.round+(cur.type==="rest"?0:1))));   // a round counts as done when its Work ends
  let left=remMs/1000;for(let i=st.idx+1;i<Q.length;i++)left+=Q[i].dur;
  setText($("remaining"),"Remaining "+fmt(Math.ceil(left)));
  setNextVis(true);
  if(nxt){setNextC("var("+META[nxt.type].c+")");setText($("nextName"),META[nxt.type].name);setHTML($("nextTime"),digits(fmt(nxt.dur)))}
  else{setNextC("var(--fg)");setText($("nextName"),"Finish");setHTML($("nextTime"),"")}
}
const ICON={
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.4-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>'
};
function sizeCta(){const c=$("cta");c.style.setProperty("--dx",(c.clientWidth/2-c.clientHeight/2)+"px")}
addEventListener("resize",sizeCta);
function renderControls(){
  const cta=$("cta"),live=mode==="run"&&!st.done;
  cta.classList.toggle("compact",live);
  const icon=mode==="home"?ICON.play:st.done?ICON.check:(st.running||!st.started)?ICON.pause:ICON.play;
  setHTML($("ctaIcon"),icon);setText($("ctaLabel"),mode==="home"?"Start":"Done");
  cta.setAttribute("aria-label",mode==="home"?"Start":st.done?"Done":st.running?"Pause":"Resume");

/* ---------- Transitions: setup ⇄ dial ---------- */
const EASE="cubic-bezier(.2,.8,.2,1)";
const homeEls=()=>[$("secHead"),...$("rows").children,$("foot")];
async function bootDial(){
  // the ring appears already full, with a quick fade
  busy=true;const cur=Q[st.idx];drawGlow();setLit(cur?N:0);setEdge(cur?N:0);
  if(!reduce)await $("dial").animate([{opacity:0},{opacity:1}],{duration:140,easing:"ease-out"}).finished;
  busy=false;
}
async function enterRun(){
  resetState();setPhase(Q[0].type);mode="run";renderControls();SFX.boot();
  if(!reduce){const anims=homeEls().map((el,i)=>el.animate([{opacity:1,transform:"none"},{opacity:0,transform:"translateX(-24px)"}],{duration:150,delay:i*25,easing:"ease-in",fill:"forwards"}));
    await Promise.all(anims.map(a=>a.finished));}
  $("home").hidden=true;homeEls().forEach(el=>el.getAnimations().forEach(a=>a.cancel()));
  $("run").hidden=false;renderRun();
  if(!reduce){$("hud").animate([{opacity:0,transform:"translateY(-10px)"},{opacity:1,transform:"none"}],{duration:240,easing:EASE});
    $("nextBox").animate([{opacity:0,transform:"translateY(10px)"},{opacity:1,transform:"none"}],{duration:240,delay:80,easing:EASE,fill:"backwards"});
    document.querySelector(".dialin").animate([{opacity:0,transform:"scale(.96)"},{opacity:1,transform:"none"}],{duration:260,easing:EASE});}
  await bootDial();
}
async function exitRun(){
  busy=true;st.running=false;releaseWake();stopVoice();SFX.down();
  if(!reduce)await $("run").animate([{opacity:1},{opacity:0}],{duration:140,easing:"ease-in",fill:"forwards"}).finished;
  $("run").hidden=true;$("run").getAnimations().forEach(a=>a.cancel());
  mode="home";resetState();paintHome();$("home").hidden=false;renderControls();
  if(!reduce)homeEls().forEach((el,i)=>el.animate([{opacity:0,transform:"translateX(-24px)"},{opacity:1,transform:"none"}],{duration:200,delay:i*28,easing:EASE,fill:"backwards"}));
  busy=false;
}
$("cta").addEventListener("click",async()=>{
  if(busy)return;ensureAudio();
  if(mode==="home"){
    // start counting on the tap itself; the transition plays on top, so there is no wait before the timer runs
    const anim=enterRun();st.started=true;st.running=true;st.last=performance.now();st.tickT=0;announce(Q[0].type);holdWake();renderControls();await anim}
  else if(st.done)exitRun();
  else if(st.running){st.running=false;releaseWake();tabTone(RESET_TONE,.6);renderControls()}
  else{st.running=true;st.last=performance.now();holdWake();tabTone(START_TONE,.6);renderControls()}
});
$("resetBtn").addEventListener("click",()=>{if(!busy)exitRun()});
document.addEventListener("keydown",e=>{if(e.code==="Space"&&$("overlay").hidden){e.preventDefault();$("cta").click()}});

/* ---------- Full-screen overlay ---------- */
let onDone=null, lastFocus=null, wheels=[];
function openOverlay(title,c,build,hint,done){
  lastFocus=document.activeElement;
  $("ovTitle").innerHTML=(c?'<i style="--c:var('+c+')"></i>':'')+title;$("ovBody").innerHTML="";build($("ovBody"));$("ovHint").textContent=hint||"";onDone=done;
  $("ovDone").hidden=!done;$("ovBack").textContent="Back";
  $("overlay").hidden=false;
  if(!reduce)$("overlay").animate([{opacity:0,transform:"translateY(24px)"},{opacity:1,transform:"none"}],{duration:220,easing:EASE});
}
async function closeOverlay(apply){
  if(apply&&onDone)onDone();onDone=null;
  if(!reduce)await $("overlay").animate([{opacity:1,transform:"none"},{opacity:0,transform:"translateY(24px)"}],{duration:160,easing:"ease-in"}).finished;
  $("overlay").hidden=true;if(lastFocus)lastFocus.focus();
}
$("ovBack").addEventListener("click",()=>{tabTone(RESET_TONE,.7);closeOverlay(false)});
$("ovDone").addEventListener("click",()=>{tabTone(START_TONE,.7);closeOverlay(true)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("overlay").hidden)closeOverlay(false)});

/* Wheel picker driven by pointer events (not native scroll): drag 1:1, flick with inertia, snap to a row.
   Native scroll-snap on iOS can lock after one row on the first swipe; this avoids that entirely. */
function makeWheel(values,label,c){
  const wrap=document.createElement("div");wrap.className="wheelwrap";wrap.style.setProperty("--c","var("+c+")");
  const w=document.createElement("div");w.className="wheel";w.tabIndex=0;w.setAttribute("role","spinbutton");w.setAttribute("aria-label",label);
  const track=document.createElement("div");track.className="track";
  track.innerHTML=values.map(v=>'<div class="wi">'+digits(pad(v))+'</div>').join("");w.appendChild(track);wrap.appendChild(w);
  const max=values.length-1, clamp=v=>Math.max(0,Math.min(max,v));
  const ih=()=>track.firstElementChild.offsetHeight||72;
  let pos=0,lastI=-1,anim=0;
  function paint(){
    const h=ih();track.style.transform="translate3d(0,"+((2-pos)*h).toFixed(2)+"px,0)";
    const kids=track.children,lo=Math.max(0,Math.floor(pos)-4),hi=Math.min(max,Math.ceil(pos)+4);
    for(let j=lo;j<=hi;j++){const d=Math.min(2.5,Math.abs(j-pos));kids[j].style.opacity=(1-d*.34).toFixed(2);kids[j].style.transform="scale("+(1-d*.1).toFixed(3)+")"}
    const i=clamp(Math.round(pos));if(lastI!==-1&&i!==lastI){SFX.ui();try{navigator.vibrate&&navigator.vibrate(4)}catch(e){}}lastI=i;
    w.setAttribute("aria-valuenow",values[i]);
  }
  function animateTo(target,ms){
    cancelAnimationFrame(anim);const from=pos,t0=performance.now();
    const step=now=>{const p=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-p,3);pos=from+(target-from)*e;paint();if(p<1)anim=requestAnimationFrame(step)};
    anim=requestAnimationFrame(step);
  }
  let drag=false,startY=0,startPos=0,moved=false,samples=[];
  w.addEventListener("pointerdown",e=>{
    cancelAnimationFrame(anim);drag=true;moved=false;startY=e.clientY;startPos=pos;samples=[[performance.now(),pos]];
    try{w.setPointerCapture(e.pointerId)}catch(_){}
  });
  w.addEventListener("pointermove",e=>{
    if(!drag)return;const dy=e.clientY-startY;if(Math.abs(dy)>3)moved=true;
    let p=startPos-dy/ih();if(p<0)p*=.35;else if(p>max)p=max+(p-max)*.35;   // soft rubber band at the ends
    pos=p;paint();const now=performance.now();samples.push([now,pos]);while(samples.length>2&&now-samples[0][0]>90)samples.shift();
  });
  const end=e=>{
    if(!drag)return;drag=false;
    if(!moved){const r=w.getBoundingClientRect(),idx=clamp(Math.round(pos+(e.clientY-(r.top+r.height/2))/ih()));animateTo(idx,200);return}
    const [t0,p0]=samples[0],dt=Math.max(16,performance.now()-t0),v=(pos-p0)/dt;   // rows per ms
    const target=clamp(Math.round(pos+v*220));animateTo(target,Math.min(650,Math.max(180,160+Math.abs(target-pos)*55)));
  };
  w.addEventListener("pointerup",end);w.addEventListener("pointercancel",end);
  let acc=0;w.addEventListener("wheel",e=>{e.preventDefault();acc+=e.deltaY;if(Math.abs(acc)>=40){const s=Math.sign(acc);acc=0;animateTo(clamp(Math.round(pos)+s),160)}},{passive:false});
  w.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){e.preventDefault();animateTo(clamp(Math.round(pos)+1),160)}
    if(e.key==="ArrowUp"){e.preventDefault();animateTo(clamp(Math.round(pos)-1),160)}});
  const api={el:wrap,paint,
    get(){return values[clamp(Math.round(pos))]},
    set(v,smooth){const i=Math.max(0,values.indexOf(v));if(smooth)animateTo(i,220);else{pos=i;paint()}}};
  return api;
}
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
function openEditor(f){
  if(mode!=="home"||busy)return;SFX.ui();
  openOverlay(f.name,f.c,body=>{
    const ed=document.createElement("div");ed.className="editor";body.appendChild(ed);
    const col=(w,u)=>{const c=document.createElement("div");c.className="col";c.appendChild(w.el);if(u){const l=document.createElement("span");l.className="unit";l.textContent=u;c.appendChild(l)}ed.appendChild(c)};
    wheels=f.time?[makeWheel(range(0,59),"Minutes",f.c),makeWheel(range(0,59),"Seconds",f.c)]:[makeWheel(range(f.min,f.max),f.name,f.c)];
    if(f.time){col(wheels[0],"Min");col(wheels[1],"Sec")}else col(wheels[0],f.name);
    requestAnimationFrame(()=>{if(f.time){wheels[0].set(Math.floor(S[f.k]/60));wheels[1].set(S[f.k]%60)}else wheels[0].set(S[f.k]);
      wheels.forEach(w=>w.paint());wheels[0].el.querySelector(".wheel").focus({preventScroll:true})});
  },f.hint,()=>{const v=f.time?wheels[0].get()*60+wheels[1].get():wheels[0].get();S[f.k]=Math.max(f.min,v);persist();paintHome()});
}
$("soundBtn").addEventListener("click",()=>{
  if(busy)return;SFX.ui();

    const toggleRow=(parent,k,t,d,after)=>{const r=document.createElement("div");r.className="trow";

        if(k==="sfx"&&!S[k]){S.sfx=true;tabTone(TOGGLE_OFF,.7);S.sfx=false;setTimeout(setMaster,90);stopVoice()}   // play the "off" click, then mute everything
        else{if(k==="sfx")setMaster();SFX.toggle(S[k])}
